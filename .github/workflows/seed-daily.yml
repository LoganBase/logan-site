name: Daily Market Data Seed

on:
  schedule:
    # 21:30 UTC = 5:30 PM ET — 90 min after US market close, Mon–Fri
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Seed mode'
        required: false
        default: '--daily'
        type: choice
        options:
          - '--daily'
          - ''

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: seed/requirements.txt

      - name: Install dependencies
        run: pip install -r seed/requirements.txt

      - name: Run seeder
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          PYTHONIOENCODING: utf-8
        run: python seed/seed.py ${{ github.event.inputs.mode || '--daily' }}
